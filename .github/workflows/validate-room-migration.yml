name: Validate Room migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v4-to-v5-migration:
    name: Validate archive database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify required Mapbox secrets
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          test -n "$MAPBOX_ACCESS_TOKEN" || { echo "MAPBOX_ACCESS_TOKEN repository secret is missing."; exit 1; }
          test -n "$MAPBOX_DOWNLOADS_TOKEN" || { echo "MAPBOX_DOWNLOADS_TOKEN repository secret is missing."; exit 1; }

      - name: Run Room migration tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.example.timelineviewer.data.local.AppDatabaseMigrationTest

      - name: Upload migration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-migration-test-reports
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
