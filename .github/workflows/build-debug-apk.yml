name: Build TMLN debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable Android signing key
        env:
          TMLN_SIGNING_KEYSTORE_BASE64: ${{ secrets.TMLN_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$TMLN_SIGNING_KEYSTORE_BASE64" || { echo "TMLN_SIGNING_KEYSTORE_BASE64 repository secret is missing."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$TMLN_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print $2; exit}')"
          test "$ACTUAL_CERT_SHA256" = "2966B16804A6FCECEF42A2B23CCD0F9150B9286E4DEA3CB058EA83993382DEF0" || { echo "The signing secret does not match TMLN's stable certificate."; exit 1; }

      - name: Verify required Mapbox secrets
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          test -n "$MAPBOX_ACCESS_TOKEN" || { echo "MAPBOX_ACCESS_TOKEN repository secret is missing."; exit 1; }
          test -n "$MAPBOX_DOWNLOADS_TOKEN" || { echo "MAPBOX_DOWNLOADS_TOKEN repository secret is missing."; exit 1; }

      - name: Run unit tests
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: TMLN_SIGNING_STORE_FILE="$HOME/.android/debug.keystore" ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: TMLN_SIGNING_STORE_FILE="$HOME/.android/debug.keystore" ./gradlew :app:assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TMLN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
