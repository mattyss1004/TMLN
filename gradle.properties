android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Increment both values for every installable TMLN APK. Android requires versionCode to rise
# monotonically; versionName is the label shown to the person installing the app.
TMLN_VERSION_CODE=2
TMLN_VERSION_NAME=1.1.0 (Build 2)
